<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabChem — Mockup giao diện</title>
<style>
:root{
  --primary:#0B7A75; --primary-dark:#085A56; --primary-tint:#E6F4F3;
  --bg:#F5F7FA; --surface:#fff; --border:#E1E6EC; --text:#1B2430; --muted:#617082;
  --success:#107C10; --warning:#9A5700; --danger:#C4314B; --info:#0F6CBD;
  --success-tint:#E7F4E7; --warning-tint:#FFF1DC; --danger-tint:#FCE8EC; --info-tint:#E5F0FA; --muted-tint:#EEF1F5;
  --radius:8px; --shadow:0 1px 2px rgba(27,36,48,.06),0 2px 8px rgba(27,36,48,.05);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button{font:inherit;cursor:pointer}
h1{font-size:22px;margin:0 0 2px;font-weight:600}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
h3{font-size:13px;margin:0 0 8px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}
.mono{font-family:Consolas,"Cascadia Mono",monospace;font-weight:600;white-space:nowrap}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:56px 1fr;height:100vh}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;min-width:220px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:-2px}
.quick{flex:1;max-width:420px;position:relative}
.quick input{width:100%;height:36px;border:1px solid var(--border);border-radius:var(--radius);padding:0 12px 0 36px;background:var(--bg);font:inherit}
.quick svg{position:absolute;left:10px;top:9px;color:var(--muted)}
.user{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-tint);color:var(--primary-dark);display:grid;place-items:center;font-weight:600}
.role{font-size:12px;color:var(--muted)}
.nav{background:var(--surface);border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border:0;background:none;border-radius:var(--radius);color:var(--text);text-align:left}
.nav button:hover{background:var(--bg)}
.nav button.on{background:var(--primary-tint);color:var(--primary-dark);font-weight:600}
.nav .sep{flex:1}
.main{overflow:auto;padding:24px;min-width:0}
.page{max-width:1180px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.danger{color:var(--danger);border-color:#EBC3CC}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.badge,.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.success{background:var(--success-tint);color:var(--success)} .warning{background:var(--warning-tint);color:var(--warning)}
.danger.badge,.danger.chip{background:var(--danger-tint);color:var(--danger)} .info{background:var(--info-tint);color:var(--info)}
.primary.badge{background:var(--primary-tint);color:var(--primary-dark)} .muted.badge{background:var(--muted-tint);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field label .req{color:var(--danger)}
.field input,.field select,.field textarea{height:40px;border:1px solid #C9D1DB;border-radius:var(--radius);padding:0 12px;font:inherit;background:#fff;color:var(--text);width:100%}
.field textarea{height:76px;padding:8px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);outline:2px solid var(--primary-tint)}
.field .hint{font-size:12px;color:var(--muted)} .field .err{font-size:12px;color:var(--danger);min-height:0}
.field.bad input{border-color:var(--danger)}
.row{display:grid;gap:12px}
.row.c2{grid-template-columns:1fr 1fr} .row.c3{grid-template-columns:repeat(3,1fr)} .row.c21{grid-template-columns:2fr 1fr}
.stack{display:flex;flex-direction:column;gap:16px}

.split-a{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
.split-b{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
.split-c{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
.split-d{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
.sticky{position:sticky;top:0}
.tabs{overflow-x:auto}
.tabs button{white-space:nowrap}
/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--primary)}
.kpi .top{display:flex;justify-content:space-between;color:var(--muted);font-weight:600;font-size:13px}
.kpi .ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.kpi .val{font-size:30px;font-weight:600;line-height:1.1}
.kpi .sub{font-size:12px;color:var(--muted)}

/* ---------- list / table ---------- */
.list{display:flex;flex-direction:column}
.list .it{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.list .it:first-child{border-top:0}
.list .it .grow{flex:1;min-width:0}
.list .it .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .search{position:relative;flex:1;min-width:220px;max-width:420px}
.toolbar .search input{width:100%;height:40px;border:1px solid #C9D1DB;border-radius:var(--radius);padding:0 12px 0 38px;font:inherit}
.toolbar .search svg{position:absolute;left:11px;top:11px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--primary-dark);border-color:var(--primary)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{height:32px;padding:0 12px;border:1px solid var(--border);background:var(--surface);border-radius:16px;font-weight:600;font-size:13px;color:var(--muted)}
.fchip.on{background:var(--primary-tint);border-color:var(--primary);color:var(--primary-dark)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);background:#FAFBFC;position:sticky;top:0}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{cursor:pointer} tbody tr:hover{background:#F8FAFB}
.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.gauge{height:8px;border-radius:4px;background:var(--muted-tint);overflow:hidden;min-width:90px}
.gauge span{display:block;height:100%;background:var(--primary);border-radius:4px}
.gauge.low span{background:var(--warning)} .gauge.zero span{background:var(--muted)}
.qtext{font-size:12px;color:var(--muted);margin-top:4px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(27,36,48,.35);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:100vw;background:var(--surface);z-index:21;transform:translateX(100%);transition:.25s;box-shadow:-8px 0 24px rgba(27,36,48,.12);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .hd{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.drawer .bd{padding:20px;overflow:auto;flex:1}
.drawer .ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.x{margin-left:auto;border:0;background:none;width:36px;height:36px;border-radius:8px;color:var(--muted)} .x:hover{background:var(--bg)}
.qrbox{width:120px;height:120px;padding:8px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);flex:none}
.qrbox svg{width:100%;height:100%;display:block}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.bigq{font-size:26px;font-weight:600}
.timeline{display:flex;flex-direction:column}
.timeline .ev{display:grid;grid-template-columns:20px 1fr auto;gap:10px;padding:8px 0;position:relative}
.timeline .ev::before{content:"";position:absolute;left:5px;top:22px;bottom:-8px;width:2px;background:var(--border)}
.timeline .ev:last-child::before{display:none}
.timeline .pt{width:12px;height:12px;border-radius:50%;background:var(--primary);margin-top:5px;border:2px solid #fff;box-shadow:0 0 0 1px var(--primary)}
.timeline .pt.neg{background:var(--warning);box-shadow:0 0 0 1px var(--warning)}
.neg-t{color:var(--warning)} .pos-t{color:var(--success)}

/* ---------- scan ---------- */
.scanner{aspect-ratio:4/3;max-height:380px;width:100%;border-radius:var(--radius);background:linear-gradient(135deg,#17222E,#22303F);position:relative;overflow:hidden;display:grid;place-items:center;color:#9FB0C3}
.scanner .frame{width:62%;aspect-ratio:1;position:relative}
.scanner .frame i{position:absolute;width:26px;height:26px;border:3px solid #5FD0C8}
.scanner .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.scanner .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.scanner .frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.scanner .frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
.scanner .line{position:absolute;left:0;right:0;height:2px;background:#5FD0C8;box-shadow:0 0 12px #5FD0C8;animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{top:6%}50%{top:92%}}
.scanner p{position:absolute;bottom:14px;margin:0;font-size:13px}
@media (prefers-reduced-motion:reduce){.scanner .line{animation:none;top:50%}}

/* ---------- stepper ---------- */
.stepper{display:flex;gap:8px;margin-bottom:16px}
.step{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);color:var(--muted);font-weight:600}
.step b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--muted-tint);font-size:12px}
.step.on{border-color:var(--primary);color:var(--primary-dark)} .step.on b{background:var(--primary);color:#fff}
.step.done b{background:var(--success);color:#fff}
.ing{display:grid;grid-template-columns:1.6fr 1fr 1.3fr 130px;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--border)}
.ing:first-of-type{border-top:0}
.ing .qty{display:flex;gap:6px}
.ing .qty input{width:100%;height:36px;border:1px solid #C9D1DB;border-radius:var(--radius);padding:0 10px;font:inherit}
.ing .qty select{height:36px;border:1px solid #C9D1DB;border-radius:var(--radius);padding:0 6px;font:inherit}
.ing.bad .qty input{border-color:var(--danger)}
.ing .e{color:var(--danger);font-size:12px;margin-top:4px}
.callout{display:flex;gap:10px;padding:10px 12px;border-radius:var(--radius);background:var(--info-tint);color:#0B4F8A;font-size:13px}
.callout.warn{background:var(--warning-tint);color:var(--warning)}

/* ---------- label ---------- */
.label{width:300px;border:1px dashed #9AA7B6;border-radius:6px;padding:10px;display:grid;grid-template-columns:84px 1fr;gap:10px;background:#fff}
.label .qr{width:84px;height:84px} .label .qr svg{width:100%;height:100%;display:block}
.label .c{font-family:Consolas,monospace;font-weight:700;font-size:15px}
.label .n{font-weight:600;font-size:13px;line-height:1.25}
.label .m{font-size:11px;color:#3B4756}
.labels{display:flex;flex-wrap:wrap;gap:12px}

/* ---------- trace tree ---------- */
.tree,.tree ul{list-style:none;margin:0;padding-left:0}
.tree ul{margin-left:18px;padding-left:18px;border-left:2px solid var(--border)}
.node{position:relative;padding:6px 0}
.tree ul>li>.node::before{content:"";position:absolute;left:-18px;top:26px;width:16px;border-top:2px solid var(--border)}
.nodecard{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.nodecard.root{border-color:var(--primary);background:var(--primary-tint)}
.nodecard .t{font-weight:600}
.nodecard .q{margin-left:auto;text-align:right;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:#1B2430;color:#fff;padding:12px 18px;border-radius:var(--radius);opacity:0;transition:.25s;z-index:40;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .app{grid-template-columns:72px minmax(0,1fr)}
  .nav button span{display:none} .nav button{justify-content:center;padding:0}
  .brand{min-width:0} .brand div{display:none}
}
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr)} .grid2,.grid2[class*="split"]{grid-template-columns:minmax(0,1fr)} .sticky{position:static}
  .hide-m{display:none} .row.c3{grid-template-columns:1fr 1fr}
  .ing{grid-template-columns:1fr 1fr}
}
@media (max-width:700px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px minmax(0,1fr) 60px}
  .nav{grid-row:3;flex-direction:row;border-right:0;border-top:1px solid var(--border);padding:6px;justify-content:space-around;overflow:auto}
  .nav .sep,.nav button.adm{display:none}
  .nav button{height:48px;min-width:48px}
  .main{padding:16px}
  .quick,.user>div:first-child{display:none}
  .row.c2,.row.c3,.row.c21{grid-template-columns:1fr}
  .stepper .step span{display:none}
  .kpis{gap:12px}
  .cards table,.cards tbody,.cards tr,.cards td{display:block}
  .cards thead{display:none}
  .cards tr{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px;border-bottom:1px solid var(--border)}
  .cards td{padding:0;border:0}
  .cards td:nth-child(1){grid-column:1;grid-row:1;white-space:nowrap}
  .cards td:nth-child(7){grid-column:2;grid-row:1;justify-self:end}
  .cards td:nth-child(2){grid-column:1/3;grid-row:2}
  .cards td:nth-child(5){grid-column:1/3;grid-row:3}
  .cards td:nth-child(6){grid-column:1/3;grid-row:4}
  .toolbar .search{max-width:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo" id="logo"></div><div>LabChem<small>Phòng Hoá phân tích</small></div></div>
    <div class="quick"><span id="qico"></span><input id="quick" placeholder="Quét hoặc nhập mã: IN-26-00042, PC-26-00031…" aria-label="Quét hoặc nhập mã nhanh"></div>
    <div class="user"><div style="text-align:right"><div style="font-weight:600">Nguyễn Văn A</div><div class="role">Analyst</div></div><div class="avatar">A</div></div>
  </header>
  <nav class="nav" id="nav" aria-label="Điều hướng chính"></nav>
  <main class="main"><div class="page" id="page"></div></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status"></div>

const PREPS = [

function expiry(d, status){
  if (status === 'Empty') return `<span class="muted">${fmt(d)}</span>`;

  if (n < 0) return `<span class="chip danger">Quá hạn ${-n} ngày</span>`;

}
function gauge(r, i, unit){
  const p = i ? Math.round(r / i * 100) : 0;
  const cls = r === 0 ? 'zero' : (p < 20 ? 'low' : '');
  return `<div class="gauge ${cls}" role="img" aria-label="Còn ${p}%"><span style="width:${p}%"></span></div><div class="qtext">${num(r)} / ${num(i)} ${unit} · ${p}%</div>`;
}
function qr(text){
  try {
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    try { return q.createSvgTag({cellSize: 4, margin: 0, scalable: true}); } catch (e) { return q.createSvgTag(4, 0); }
  } catch (e) {
    let s = ''; let h = 0; for (const c of text) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) { h = (h * 1103515245 + 12345) >>> 0; if ((h >> 16) & 1) s += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }
    return `<svg viewBox="0 0 21 21" fill="#1B2430">${s}</svg>`;
  }
}

/* ---- Nhập hoá chất ---- */
const CAT = [['Natri hydroxit (NaOH) AR','g'],['Acid clohydric 37% AR','mL'],['Methanol HPLC','mL'],['Kali hydro phtalat (chuẩn)','g'],['Ống chuẩn pH 7.00','pcs']];
const UNITS = {g:[['mg',.001],['g',1],['kg',1000]], mL:[['µL',.001],['mL',1],['L',1000]], pcs:[['pcs',1]]};
V.lot = () => `
  <div class="page-head"><div><h1>Đăng ký hoá chất đầu vào</h1><p class="muted" style="margin:0">Mỗi chai nhận một mã QR riêng — dán nhãn ngay sau khi lưu</p></div></div>
  <div class="grid2 split-a">
   <div class="stack">
    <div class="card"><h2>1 · Hoá chất</h2><div class="row c21"><div class="field"><label for="chem">Hoá chất <span class="req">*</span></label><select id="chem" onchange="lotCalc()">${CAT.map((c,i) => `<option value="${i}">${c[0]}</option>`).join('')}</select><div class="hint">Gõ để tìm theo tên hoặc số CAS. Không thấy? Nhờ Admin thêm vào danh mục.</div></div>
      <div class="field"><label>Đơn vị gốc</label><input id="base" disabled></div></div></div>
    <div class="card"><h2>2 · Nguồn gốc</h2><div class="row c3">

      <div class="field"><label for="mfr">Hãng sản xuất</label><input id="mfr" value="Merck"></div>
      <div class="field"><label for="sup">Nhà cung cấp</label><input id="sup" value="Cty Hoá chất Á Châu"></div>
      <div class="field"><label for="recv">Ngày nhận <span class="req">*</span></label><input id="recv" type="date" value="2026-10-24" oninput="lotCalc()"></div>
      <div class="field"><label for="mfg">Ngày sản xuất</label><input id="mfg" type="date" value="2026-03-01"></div>
      <div class="field" id="expf"><label for="expd">Hạn dùng <span class="req">*</span></label><input id="expd" type="date" value="2028-03-01" oninput="lotCalc()"><div class="err" id="experr"></div></div></div></div>
    <div class="card"><h2>3 · Lượng và vị trí</h2><div class="row c3">
      <div class="field"><label for="qty">Lượng mỗi chai <span class="req">*</span></label><div style="display:flex;gap:8px"><input id="qty" type="number" min="0" step="any" value="500" oninput="lotCalc()"><select id="unit" style="width:90px" onchange="lotCalc()"></select></div><div class="hint" id="qhint"></div></div>
      <div class="field"><label for="n">Số chai <span class="req">*</span></label><input id="n" type="number" min="1" max="20" value="3" oninput="lotCalc()"><div class="hint">Tối đa 20 chai / lần</div></div>
      <div class="field"><label for="loc">Vị trí</label><select id="loc"><option>P.205 · Tủ A · Ngăn 2</option><option>P.205 · Tủ hút</option><option>P.205 · Tủ chống cháy</option></select></div></div>
      <div class="row c2" style="margin-top:12px"><div class="field"><label for="coa">Link COA</label><input id="coa" placeholder="https://…sharepoint.com/…/COA.pdf"></div><div class="field"><label for="note">Ghi chú</label><input id="note"></div></div></div>
   </div>
   <div class="stack sticky">
    <div class="card" id="sum"></div>
   </div>
  </div>`;
AFTER.lot = () => { lotCalc(); };
function lotCalc(){
  const c = CAT[document.getElementById('chem').value]; document.getElementById('base').value = c[1];
  const us = document.getElementById('unit'); if (!us.dataset.b || us.dataset.b !== c[1]) { us.innerHTML = UNITS[c[1]].map(u => `<option ${u[1]===1?'selected':''}>${u[0]}</option>`).join(''); us.dataset.b = c[1]; }
  const f = UNITS[c[1]].find(u => u[0] === us.value)[1]; const q = parseFloat(document.getElementById('qty').value) || 0; const n = Math.max(0, Math.min(20, parseInt(document.getElementById('n').value) || 0));
  const base = q * f; document.getElementById('qhint').textContent = f !== 1 ? `= ${num(base)} ${c[1]} (lưu theo đơn vị gốc)` : '';
  const ok = document.getElementById('expd').value > document.getElementById('recv').value && q > 0 && n >= 1;
  document.getElementById('expf').classList.toggle('bad', document.getElementById('expd').value <= document.getElementById('recv').value);
  document.getElementById('experr').textContent = document.getElementById('expd').value <= document.getElementById('recv').value ? 'Hạn dùng phải sau ngày nhận' : '';
  document.getElementById('sum').innerHTML = `<h2>Tóm tắt</h2><dl class="kv"><dt>Hoá chất</dt><dd>${c[0]}</dd><dt>Số chai</dt><dd>${n}</dd><dt>Mỗi chai</dt><dd>${num(base)} ${c[1]}</dd><dt>Tổng</dt><dd>${num(base*n)} ${c[1]}</dd></dl>
   <h3 style="margin-top:16px">Nhãn dán lên chai</h3>${label('IN-26-0xxxx', c[0], 'Lô '+document.getElementById('mlot').value+' · '+document.getElementById('mfr').value, 'HSD '+fmt(document.getElementById('expd').value||'2028-03-01'))}
   <p class="muted" style="font-size:12px">Mã thật được cấp khi lưu; hình trên chỉ để xem bố cục.</p>
   <button class="btn primary" style="width:100%;justify-content:center" ${ok?'':'disabled'} onclick="lotSave(${n},'${c[0]}')">${I('print')}Lưu và in nhãn</button>`;
}
function lotSave(n, name){
  const base = 71; const codes = Array.from({length:n}, (_, i) => 'IN-26-' + String(base + i).padStart(5, '0'));
  document.getElementById('sum').innerHTML = `<h2>${I('check')} Đã tạo ${n} chai</h2><p class="muted">Dán nhãn lên từng chai ngay bây giờ.</p><div class="labels">${codes.map(c => label(c, name, 'Lô '+document.getElementById('mlot').value, 'HSD '+fmt(document.getElementById('expd').value))).join('')}</div>
   <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="toast('Print() — in ${n} nhãn')">${I('print')}In nhãn</button><button class="btn" onclick="go('lot')">Nhập tiếp</button></div>`;
  toast('Đã tạo ' + n + ' chai: ' + codes[0] + (n > 1 ? ' … ' + codes[n-1] : ''));
}

 {code:'IN-26-00042',name:'NaOH AR · lô 1.06498.1000',avail:412.5,unit:'g',exp:'2028-03-01',status:'InUse',qty:4,role:'Chất tan'},

V.prep = () => `

  <div id="stepbody"></div>`;
AFTER.prep = () => stepBody();
function stepBody(){
  const el = document.getElementById('stepbody'); if (!el) return;
  if (state.step === 1) {
    el.innerHTML = `<div class="card"><div class="row c3">

      <div class="field"><label>Nồng độ</label><input value="0,1 mol/L"></div>
      <div class="field"><label>SOP / phương pháp</label><input value="SOP-QC-014"></div>
      <div class="field"><label>Ngày pha</label><input type="date" value="2026-10-24"></div>
      <div class="field"><label>Thể tích sau pha <span class="req">*</span></label><div style="display:flex;gap:8px"><input type="number" value="1000"><select style="width:80px"><option>mL</option><option>L</option></select></div></div>
      <div class="field"><label>Vị trí</label><select><option>P.205 · Kệ B</option></select></div>
      <div class="field"><label>Điều kiện bảo quản</label><select><option>15-25 °C (phòng)</option><option>2-8 °C</option></select></div>
      <div class="field" style="grid-column:1/-1"><label>Cách pha</label><textarea>Hoà tan 4,0 g NaOH trong khoảng 900 mL nước cất, để nguội, định mức đến 1.000 mL.</textarea></div></div></div>
      <div class="actions" style="margin-top:16px;justify-content:flex-end"><button class="btn primary" onclick="state.step=2;go('prep')">Tiếp: Thành phần →</button></div>`;
    return;
  }
  if (state.step === 2) {
    el.innerHTML = `<div class="grid2 split-b">
     <div class="card"><div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap"><div class="field" style="flex:1;min-width:200px"><input placeholder="Quét hoặc nhập mã chai / dung dịch… rồi Enter" aria-label="Thêm thành phần"></div><button class="btn">${I('scan')}Quét</button><button class="btn">${I('search')}Chọn từ tồn kho</button></div>
      <div id="ings"></div>
      <div class="callout" style="margin-top:12px">${I('alert')}<div>Thử gõ <b>3000</b> vào ô lượng của nước cất: lỗi vượt tồn hiện ngay tại dòng, trước khi gửi lên máy chủ.</div></div></div>

     <div class="actions" style="margin-top:16px;justify-content:space-between"><button class="btn" onclick="state.step=1;go('prep')">← Quay lại</button><button class="btn primary" id="next2" onclick="state.step=3;go('prep')">Tiếp: Xác nhận →</button></div>`;
    ingRender(); return;

  const minExp = ING.map(i => i.exp).sort()[0];

    <div class="list">${ING.map(i => `<div class="it"><div class="grow"><div class="t">${i.name}</div><div class="muted" style="font-size:12px"><span class="mono">${i.code}</span> · ${i.role}</div></div><b>${num(i.qty)} ${i.unit}</b></div>`).join('')}</div>
    <div class="callout" style="margin-top:12px">${I('check')}<div>Hạn dùng dung dịch (20/11/2026) không vượt hạn dùng sớm nhất của thành phần (${fmt(minExp)}).</div></div></div>
    <div class="card"><h2>NaOH 0,1 N</h2><dl class="kv"><dt>Thể tích</dt><dd>1.000 mL</dd><dt>Ngày pha</dt><dd>24/10/2026</dd><dt>Hạn dùng</dt><dd>20/11/2026</dd><dt>Người pha</dt><dd>Nguyễn Văn A</dd></dl>

    <button class="btn primary" style="width:100%;justify-content:center;margin-top:12px" onclick="toast('Đã tạo PC-26-00032 · trừ tồn 2 thành phần · chờ duyệt')">${I('print')}Lưu và in nhãn</button></div></div>
    <div class="actions" style="margin-top:16px"><button class="btn" onclick="state.step=2;go('prep')">← Quay lại</button></div>`;
}
function ingRender(){
  document.getElementById('ings').innerHTML = ING.map((i, k) => {
    const bad = i.qty <= 0 || i.qty > i.avail; const msg = i.qty <= 0 ? 'Nhập lượng' : (i.qty > i.avail ? `Vượt lượng còn lại (${num(i.avail)} ${i.unit})` : '');
    return `<div class="ing ${bad?'bad':''}"><div><b>${i.name}</b><div class="muted" style="font-size:12px"><span class="mono">${i.code}</span> · HSD ${fmt(i.exp)}</div></div>
      <div><div class="muted" style="font-size:12px">Còn lại</div><b>${num(i.avail)} ${i.unit}</b></div>
      <div><div class="qty"><input type="number" min="0" step="any" value="${i.qty}" aria-label="Lượng dùng ${i.name}" oninput="ING[${k}].qty=parseFloat(this.value)||0;ingCheck()"><select aria-label="Đơn vị"><option>${i.unit}</option></select></div><div class="e" id="e${k}">${msg}</div></div>
      <div><select style="height:36px;width:100%;border:1px solid #C9D1DB;border-radius:8px;padding:0 6px" aria-label="Vai trò"><option>${i.role}</option><option>Chất tan</option><option>Dung môi</option><option>Phụ gia</option></select></div></div>`;
  }).join('');

function ingCheck(){
  let allOk = true;
  ING.forEach((i, k) => { const bad = i.qty <= 0 || i.qty > i.avail; if (bad) allOk = false; const e = document.getElementById('e' + k); if (e) { e.textContent = i.qty <= 0 ? 'Nhập lượng' : (i.qty > i.avail ? `Vượt lượng còn lại (${num(i.avail)} ${i.unit})` : ''); e.closest('.ing').classList.toggle('bad', bad); } });
  const minExp = ING.map(i => i.exp).sort()[0];
  document.getElementById('ingsum').innerHTML = `<h2>Kiểm tra</h2><dl class="kv"><dt>Thành phần</dt><dd>${ING.length}</dd><dt>Hạn dùng tối đa</dt><dd>${fmt(minExp)}</dd><dt>Trạng thái</dt><dd>${allOk?'<span class="chip success">Hợp lệ</span>':'<span class="chip danger">Có lỗi cần sửa</span>'}</dd></dl>`;
  const nb = document.getElementById('next2'); if (nb) nb.disabled = !allOk;
}

    <div style="margin-top:16px"><button class="btn" onclick="toast('Xuất báo cáo truy xuất (giai đoạn 2)')">${I('down')}Xuất báo cáo</button></div></div>

}
